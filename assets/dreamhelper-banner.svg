<svg width="1280" height="360" viewBox="0 0 1280 360" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B1026"/><stop offset="0.48" stop-color="#182B67"/><stop offset="1" stop-color="#3B1D78"/>
    </linearGradient>
    <linearGradient id="accent" x1="170" y1="60" x2="1100" y2="300" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8BE9FF"/><stop offset="0.5" stop-color="#B9A7FF"/><stop offset="1" stop-color="#FFB7D5"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1035 64) rotate(130) scale(280)">
      <stop stop-color="#7DD3FC" stop-opacity="0.34"/><stop offset="1" stop-color="#7DD3FC" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(170 326) rotate(-30) scale(300)">
      <stop stop-color="#C4B5FD" stop-opacity="0.28"/><stop offset="1" stop-color="#C4B5FD" stop-opacity="0"/>
